server.port: 8080
spring.application.name: stockpulse
spring.datasource.url: ${DB_URL:jdbc:mysql://localhost:3306/stockpulse?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username: ${DB_USERNAME}
spring.datasource.password: ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.open-in-view: false
spring.flyway.enabled: ${FLYWAY_ENABLED:true}
spring.datasource.hikari.connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id: stockpulse-recommendations
spring.kafka.listener.auto-startup: ${KAFKA_ENABLED:false}
management.endpoints.web.exposure.include: health,info,metrics
management.endpoint.health.show-details: never
spring.security.oauth2.resourceserver.jwt.issuer-uri: ${OAUTH_ISSUER_URI:http://localhost:9000/realms/stockpulse}
stockpulse.security.jwk-set-uri: ${OAUTH_JWK_SET_URI:http://localhost:9000/realms/stockpulse/protocol/openid-connect/certs}
stockpulse.security.audience: ${OAUTH_AUDIENCE:stockpulse-api}
stockpulse.kafka-enabled: ${KAFKA_ENABLED:false}
stockpulse.demand-spike-multiplier: ${DEMAND_SPIKE_MULTIPLIER:2.0}
stockpulse.recommendation-strategy: ${RECOMMENDATION_STRATEGY:RULE_BASED}
stockpulse.cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4200}
llm.provider: ${LLM_PROVIDER:mock}
llm.base-url: ${LLM_BASE_URL:}
llm.api-key: ${LLM_API_KEY:}
llm.model: ${LLM_MODEL:}
llm.product-header: ${LLM_PRODUCT_HEADER:}
llm.cookie: ${LLM_COOKIE:}
llm.connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:3000}
llm.read-timeout-ms: ${LLM_READ_TIMEOUT_MS:15000}
resilience4j.circuitbreaker.instances.llmGateway.register-health-indicator: true
resilience4j.circuitbreaker.instances.llmGateway.sliding-window-type: COUNT_BASED
resilience4j.circuitbreaker.instances.llmGateway.sliding-window-size: 10
resilience4j.circuitbreaker.instances.llmGateway.minimum-number-of-calls: 5
resilience4j.circuitbreaker.instances.llmGateway.failure-rate-threshold: 50
resilience4j.circuitbreaker.instances.llmGateway.wait-duration-in-open-state: 30s
resilience4j.circuitbreaker.instances.llmGateway.permitted-number-of-calls-in-half-open-state: 3
resilience4j.circuitbreaker.instances.llmGateway.automatic-transition-from-open-to-half-open-enabled: true
resilience4j.retry.instances.llmGateway.max-attempts: 3
resilience4j.retry.instances.llmGateway.wait-duration: 250ms
resilience4j.retry.instances.llmGateway.ignore-exceptions[0]: io.github.resilience4j.ratelimiter.RequestNotPermitted
resilience4j.retry.instances.llmGateway.ignore-exceptions[1]: io.github.resilience4j.circuitbreaker.CallNotPermittedException
resilience4j.ratelimiter.instances.llmGateway.limit-for-period: 10
resilience4j.ratelimiter.instances.llmGateway.limit-refresh-period: 1m
resilience4j.ratelimiter.instances.llmGateway.timeout-duration: 0
