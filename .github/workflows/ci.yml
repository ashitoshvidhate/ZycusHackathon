name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, tests, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend-h2:
    name: Backend integration tests (H2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode --no-transfer-progress verify

  backend-mysql:
    name: Backend integration tests (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockpulse
          MYSQL_USER: stockpulse
          MYSQL_PASSWORD: stockpulse-ci-password
          MYSQL_ROOT_PASSWORD: root-ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/stockpulse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: stockpulse
      SPRING_DATASOURCE_PASSWORD: stockpulse-ci-password
      OAUTH_ISSUER_URI: https://identity.example.test/realms/stockpulse
      OAUTH_JWK_SET_URI: https://identity.example.test/realms/stockpulse/protocol/openid-connect/certs
      OAUTH_AUDIENCE: stockpulse-api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn --batch-mode --no-transfer-progress verify

  docker-compose:
    name: Compose validation and image builds
    runs-on: ubuntu-latest
    needs: [frontend, backend-h2, backend-mysql]
    env:
      DB_USERNAME: stockpulse
      DB_PASSWORD: stockpulse-ci-password
      OAUTH_ISSUER_URI: https://identity.example.test/realms/stockpulse
      OAUTH_JWK_SET_URI: https://identity.example.test/realms/stockpulse/protocol/openid-connect/certs
      OAUTH_AUDIENCE: stockpulse-api
      VITE_OIDC_AUTHORITY: https://identity.example.test/realms/stockpulse
      VITE_OIDC_CLIENT_ID: stockpulse-web
      VITE_OIDC_REDIRECT_URI: https://stockpulse.example.test/auth/callback
      VITE_OIDC_LOGOUT_REDIRECT_URI: https://stockpulse.example.test
      VITE_OIDC_SCOPE: openid profile stockpulse.read inventory.write suggestions.write suggestions.review strategy.admin
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build backend and frontend images
        run: docker compose build --parallel

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
