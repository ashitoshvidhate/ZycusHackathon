services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockpulse
      MYSQL_USER: stockpulse
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-me
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      ALLOW_PLAINTEXT_LISTENER: yes
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/stockpulse?serverTimezone=UTC
      DB_USERNAME: stockpulse
      DB_PASSWORD: change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_PRODUCT_HEADER: ${LLM_PRODUCT_HEADER:-}
      LLM_COOKIE: ${LLM_COOKIE:-}
      LLM_CONNECT_TIMEOUT_MS: ${LLM_CONNECT_TIMEOUT_MS:-3000}
      LLM_READ_TIMEOUT_MS: ${LLM_READ_TIMEOUT_MS:-15000}
      RECOMMENDATION_STRATEGY: ${RECOMMENDATION_STRATEGY:-RULE_BASED}
      OAUTH_ISSUER_URI: ${OAUTH_ISSUER_URI:-http://localhost:9000/realms/stockpulse}
      OAUTH_JWK_SET_URI: ${OAUTH_JWK_SET_URI:-http://localhost:9000/realms/stockpulse/protocol/openid-connect/certs}
      OAUTH_AUDIENCE: ${OAUTH_AUDIENCE:-stockpulse-api}
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:5173/auth/callback}
        VITE_OIDC_LOGOUT_REDIRECT_URI: ${VITE_OIDC_LOGOUT_REDIRECT_URI:-http://localhost:5173}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile stockpulse.read inventory.write suggestions.write suggestions.review strategy.admin}
    ports: ["5173:80"]
    depends_on: [backend]
